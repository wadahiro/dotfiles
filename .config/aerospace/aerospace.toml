# AeroSpace config
# Reference: https://nikitabobko.github.io/AeroSpace/guide

# Start AeroSpace at login
start-at-login = true

# Start JankyBorders with AeroSpace
after-startup-command = [
  'exec-and-forget borders active_color=0xffff9944 inactive_color=0xff494d64 width=10.0 hidpi=on'
]

# Mouse follows focus
on-focus-changed = ['move-mouse window-lazy-center']

# Normalizations
enable-normalization-flatten-containers = true
enable-normalization-opposite-orientation-for-nested-containers = true

# Layout settings
default-root-container-layout = 'tiles'
default-root-container-orientation = 'auto'

# Workspace to monitor assignment
[workspace-to-monitor-force-assignment]
1 = 'main'
2 = 'main'
3 = 'main'
4 = 'main'
5 = 'main'
6 = 'secondary'
7 = 'secondary'
8 = 'secondary'
9 = 'secondary'

# Gaps (matching yabai: 5px)
[gaps]
inner.horizontal = 10
inner.vertical = 10
outer.left = 10 
outer.bottom = 10
outer.top = 10
outer.right = 10

# Main keybindings
[mode.main.binding]
# Focus window (alt + hjkl)
alt-h = 'focus left'
alt-j = 'focus down'
alt-k = 'focus up'
alt-l = 'focus right'

# Move window (alt + shift + hjkl)
alt-shift-h = 'move left'
alt-shift-j = 'move down'
alt-shift-k = 'move up'
alt-shift-l = 'move right'

# Resize mode
#alt-r = 'mode resize'

# Toggle fullscreen
alt-f = 'fullscreen'

# Toggle float
alt-t = 'layout floating tiling'

# Toggle split orientation
alt-e = 'layout tiles horizontal vertical'

# Balance sizes
alt-shift-0 = 'balance-sizes'

# Workspace switching (alt + number)
alt-1 = 'workspace 1'
alt-2 = 'workspace 2'
alt-3 = 'workspace 3'
alt-4 = 'workspace 4'
alt-5 = 'workspace 5'
alt-6 = 'workspace 6'
alt-7 = 'workspace 7'
alt-8 = 'workspace 8'
alt-9 = 'workspace 9'

# Move window to workspace (alt + shift + number)
alt-shift-1 = 'move-node-to-workspace 1'
alt-shift-2 = 'move-node-to-workspace 2'
alt-shift-3 = 'move-node-to-workspace 3'
alt-shift-4 = 'move-node-to-workspace 4'
alt-shift-5 = 'move-node-to-workspace 5'
alt-shift-6 = 'move-node-to-workspace 6'
alt-shift-7 = 'move-node-to-workspace 7'
alt-shift-8 = 'move-node-to-workspace 8'
alt-shift-9 = 'move-node-to-workspace 9'

alt-shift-minus = 'resize smart -50'
alt-shift-equal = 'resize smart +50'

# Resize mode
[mode.resize.binding]
h = 'resize width -50'
j = 'resize height +50'
k = 'resize height -50'
l = 'resize width +50'
esc = 'mode main'
enter = 'mode main'

[[on-window-detected]]
if.app-id = 'com.apple.finder'
run = 'layout floating'

[[on-window-detected]]
if.app-id = 'com.apple.systempreferences'
run = 'layout floating'

