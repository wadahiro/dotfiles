# AeroSpace config
# Reference: https://nikitabobko.github.io/AeroSpace/guide

# Start AeroSpace at login
start-at-login = true

# Start JankyBorders and aerotag server with AeroSpace
after-startup-command = [
  'exec-and-forget borders active_color=0xffff9944 inactive_color=0xff494d64 width=10.0 hidpi=on',
  'exec-and-forget aerotag server'
]

# Sync aerotag on workspace change
exec-on-workspace-change = ['/bin/bash', '-c', 'aerotag hook']

# Mouse follows focus (disabled)
# on-focus-changed = ['move-mouse window-lazy-center']

# Normalizations
enable-normalization-flatten-containers = true
enable-normalization-opposite-orientation-for-nested-containers = true

# PATH settings for aerotag
[exec.env-vars]
PATH = '/opt/homebrew/bin:${HOME}/.cargo/bin:${PATH}'

# Layout settings
default-root-container-layout = 'tiles'
default-root-container-orientation = 'auto'

# Workspace to monitor assignment
# Disabled for aerotag compatibility - aerotag manages workspaces dynamically
# [workspace-to-monitor-force-assignment]
# 1 = 'main'
# 2 = 'main'
# 3 = 'main'
# 4 = 'main'
# 5 = 'main'
# 6 = 'secondary'
# 7 = 'secondary'
# 8 = 'secondary'
# 9 = 'secondary'

# Gaps (matching yabai: 5px)
[gaps]
inner.horizontal = 10
inner.vertical = 10
outer.left = 10 
outer.bottom = 10
outer.top = 10
outer.right = 10

# Main keybindings
[mode.main.binding]
# Focus window (alt + hjkl)
alt-h = 'focus left'
alt-j = 'focus down'
alt-k = 'focus up'
alt-l = 'focus right'

# Move window (alt + shift + hjkl)
alt-shift-h = 'move left'
alt-shift-j = 'move down'
alt-shift-k = 'move up'
alt-shift-l = 'move right'

# Resize mode
#alt-r = 'mode resize'

# Toggle fullscreen
alt-f = 'fullscreen'

# Toggle float
alt-t = 'layout floating tiling'

# Toggle split orientation
alt-e = 'layout tiles horizontal vertical'

# Balance sizes
alt-shift-0 = 'balance-sizes'

# Enter aerotag mode (Zellij-style)
alt-g = 'mode aerotag'

alt-shift-minus = 'resize smart -50'
alt-shift-equal = 'resize smart +50'

# Resize mode
[mode.resize.binding]
h = 'resize width -50'
j = 'resize height +50'
k = 'resize height -50'
l = 'resize width +50'
esc = 'mode main'
enter = 'mode main'

# Aerotag mode (Zellij-style: alt+g to enter)
[mode.aerotag.binding]
# Tag view switching (1-9) - immediate
1 = ['exec-and-forget aerotag tag-view 1', 'mode main']
2 = ['exec-and-forget aerotag tag-view 2', 'mode main']
3 = ['exec-and-forget aerotag tag-view 3', 'mode main']
4 = ['exec-and-forget aerotag tag-view 4', 'mode main']
5 = ['exec-and-forget aerotag tag-view 5', 'mode main']
6 = ['exec-and-forget aerotag tag-view 6', 'mode main']
7 = ['exec-and-forget aerotag tag-view 7', 'mode main']
8 = ['exec-and-forget aerotag tag-view 8', 'mode main']
9 = ['exec-and-forget aerotag tag-view 9', 'mode main']

# Toggle tag visibility (shift + 1-9) - show multiple tags (stays in mode)
shift-1 = 'exec-and-forget aerotag tag-toggle 1'
shift-2 = 'exec-and-forget aerotag tag-toggle 2'
shift-3 = 'exec-and-forget aerotag tag-toggle 3'
shift-4 = 'exec-and-forget aerotag tag-toggle 4'
shift-5 = 'exec-and-forget aerotag tag-toggle 5'
shift-6 = 'exec-and-forget aerotag tag-toggle 6'
shift-7 = 'exec-and-forget aerotag tag-toggle 7'
shift-8 = 'exec-and-forget aerotag tag-toggle 8'
shift-9 = 'exec-and-forget aerotag tag-toggle 9'

# Switch to last viewed tag
tab = ['exec-and-forget aerotag tag-last', 'mode main']

# Enter move submode (m -> 1-9 for tag, m -> m for monitor)
m = 'mode aerotag-move'

# Enter tag-assign submode (t -> 1-9 to toggle tag on window)
t = 'mode aerotag-tag'

# Exit aerotag mode
esc = 'mode main'
alt-g = 'mode main'

# Aerotag move submode (m -> ...)
[mode.aerotag-move.binding]
# Move window to tag (1-9)
1 = ['exec-and-forget aerotag window-move 1', 'mode main']
2 = ['exec-and-forget aerotag window-move 2', 'mode main']
3 = ['exec-and-forget aerotag window-move 3', 'mode main']
4 = ['exec-and-forget aerotag window-move 4', 'mode main']
5 = ['exec-and-forget aerotag window-move 5', 'mode main']
6 = ['exec-and-forget aerotag window-move 6', 'mode main']
7 = ['exec-and-forget aerotag window-move 7', 'mode main']
8 = ['exec-and-forget aerotag window-move 8', 'mode main']
9 = ['exec-and-forget aerotag window-move 9', 'mode main']

# Move window to other monitor (m -> m)
m = ['exec-and-forget aerotag window-move-monitor next', 'mode main']

# Cancel
esc = 'mode aerotag'

# Aerotag tag-assign submode (t -> ...)
[mode.aerotag-tag.binding]
# Toggle tag on window (1-9)
1 = ['exec-and-forget aerotag window-toggle 1', 'mode main']
2 = ['exec-and-forget aerotag window-toggle 2', 'mode main']
3 = ['exec-and-forget aerotag window-toggle 3', 'mode main']
4 = ['exec-and-forget aerotag window-toggle 4', 'mode main']
5 = ['exec-and-forget aerotag window-toggle 5', 'mode main']
6 = ['exec-and-forget aerotag window-toggle 6', 'mode main']
7 = ['exec-and-forget aerotag window-toggle 7', 'mode main']
8 = ['exec-and-forget aerotag window-toggle 8', 'mode main']
9 = ['exec-and-forget aerotag window-toggle 9', 'mode main']

# Cancel
esc = 'mode aerotag'

# Floating apps (must come before aerotag hook)
[[on-window-detected]]
if.app-id = 'com.apple.finder'
check-further-callbacks = true
run = 'layout floating'

[[on-window-detected]]
if.app-id = 'com.apple.systempreferences'
check-further-callbacks = true
run = 'layout floating'

# Sync aerotag when new window is detected
[[on-window-detected]]
run = ['exec-and-forget aerotag hook']

